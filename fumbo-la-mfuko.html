<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>Fumbo la Mfuko - Crossword</title>
<style>
  html { color-scheme: light only; background: #F7F6F2; }
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #F7F6F2;
    color: #2B2B28;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }

  #app {
    max-width: 460px;
    width: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 24px 20px 12px;
    text-align: center;
  }

  h1 {
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 24px;
    font-weight: 700;
  }

  .subtitle {
    font-size: 13px;
    color: #9B978C;
    margin-top: 4px;
  }

  .progress {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .pip {
    width: 22px;
    height: 4px;
    border-radius: 2px;
    background: #DDD9D0;
    transition: background 0.3s;
  }

  .pip.done { background: #4A7C59; }

  .grid-wrap {
    display: flex;
    justify-content: center;
    padding: 8px 10px;
    overflow-x: auto;
  }

  .grid {
    display: grid;
    gap: 2px;
  }

  .cell {
    width: 33px;
    height: 33px;
    background: #fff;
    border: 1px solid #D0CEC6;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-size: 14px;
    font-weight: 700;
    color: #CCC;
    transition: background 0.3s, color 0.3s;
  }

  .cell.empty { background: transparent; border: none; }
  .cell.selected { background: #FFF6E0; }
  .cell.done { background: #E8F3EB; color: #3A7D4F; }

  .cell-num {
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 7px;
    font-weight: 600;
    color: #9B978C;
  }

  .clue-bar {
    margin: 12px 20px 0;
    padding: 14px 16px;
    background: #fff;
    border-radius: 10px;
    border: 1px solid #E5E2DA;
  }

  .swali-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #fff;
    background: #D4A843;
    padding: 3px 10px;
    border-radius: 12px;
    margin-bottom: 8px;
  }

  .clue-text {
    font-size: 15px;
    color: #2B2B28;
    line-height: 1.5;
    font-weight: 500;
  }

  .blank {
    display: inline-block;
    min-width: 70px;
    border-bottom: 2px solid #D4A843;
    color: transparent;
    font-weight: 700;
  }

  .hint-row {
    text-align: center;
    font-size: 11px;
    color: #B0AA9C;
    margin-top: 8px;
    padding: 0 20px;
  }

  .word-bank {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 14px 16px 6px;
    flex-wrap: wrap;
  }

  .word-btn {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 18px;
    background: #fff;
    border: 2px solid #C8C4B8;
    border-radius: 20px;
    color: #2B2B28;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all 0.15s;
  }

  .word-btn:active { transform: scale(0.95); }

  .word-btn.correct-flash {
    background: #E8F3EB;
    border-color: #4A7C59;
    color: #2E5E3C;
  }

  .word-btn.wrong-flash {
    background: #FDE8E8;
    border-color: #E5A0A0;
    color: #C0392B;
  }

  .clues-list {
    padding: 16px 20px;
    flex: 1;
  }

  .clue-section-title {
    font-size: 12px;
    font-weight: 700;
    color: #9B978C;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .clue-section-title:first-child { margin-top: 0; }

  .clue-row {
    display: flex;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    align-items: flex-start;
  }

  .clue-row.active { background: #FFF6E0; }
  .clue-row.solved { background: #E8F3EB; }

  .clue-row-num {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: #D4A843;
    min-width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .clue-row.solved .clue-row-num { background: #4A7C59; }

  .clue-row-text {
    font-size: 13px;
    color: #4A4A45;
    line-height: 1.4;
    padding-top: 2px;
  }

  .clue-row.solved .clue-row-text {
    color: #3A7D4F;
    text-decoration: line-through;
  }

  .teach-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }

  .teach-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    animation: pop 0.3s ease-out;
  }

  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .teach-word {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #4A7C59;
    margin-bottom: 4px;
  }

  .teach-check {
    font-size: 13px;
    font-weight: 600;
    color: #4A7C59;
    margin-bottom: 14px;
  }

  .teach-quote {
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 15px;
    line-height: 1.6;
    color: #3A3A36;
    font-style: italic;
  }

  .teach-source {
    font-size: 12px;
    color: #9B978C;
    margin-top: 10px;
  }

  .teach-source a { color: #8B7D3C; }

  .teach-btn {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 700;
    background: #4A7C59;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .done-card {
    text-align: center;
    padding: 26px 16px;
  }

  .done-title {
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 24px;
    font-weight: 700;
    color: #D4A843;
  }

  .done-sub {
    font-size: 15px;
    color: #6B6860;
    margin-top: 10px;
    line-height: 1.55;
  }

  footer {
    text-align: center;
    padding: 12px 20px 24px;
    font-size: 11px;
    color: #C8C4B8;
  }

  .start-screen {
    text-align: center;
    padding: 30px 16px;
  }

  .start-icon { font-size: 40px; margin-bottom: 14px; }

  .start-desc {
    font-size: 15px;
    color: #6B6860;
    line-height: 1.6;
    margin: 14px 0 26px;
  }

  .start-btn {
    padding: 16px 36px;
    font-size: 16px;
    font-weight: 700;
    background: #4A7C59;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const WORDS = [
  {
    id: 1, word: "WOTE", dir: "across", row: 0, col: 3, part: 1,
    clue: "Ni watu gani wanabidi kuchangia?",
    options: ["WOTE", "WACHACHE", "MATAJIRI"],
    teachQuote: "Wote wanaweza kusali, kupigana vita vyao vya kiroho, na kutoa kwa Mfuko. Kama kila muumini atatekeleza wajibu huu mtakatifu, tutashangazwa na ongezeko la nguvu litakalopatikana kwa mwili mzima.",
    teachSource: "Nyumba ya Haki ya Ulimwengu, Wellspring of Guidance, uk. 19-20",
    teachLink: "https://bahai-library.com/pdf/s/stewardship_development.pdf"
  },
  {
    id: 2, word: "WAJIBU", dir: "down", row: 0, col: 3, part: 1,
    template: "Kutoa ni ___ wa Kiroho.",
    options: ["WAJIBU", "KIPAJI", "CHAGUO"],
    teachQuote: "Kutoa kwa Mfuko ni huduma ambayo kila muumini anaweza kutoa, awe maskini au tajiri; kwani hii ni wajibu wa kiroho ambapo kiasi kinachotolewa si muhimu.",
    teachSource: "Nyumba ya Haki ya Ulimwengu, 18 Desemba 1963",
    teachLink: "https://www.bahai.org/library/authoritative-texts/compilations/bahai-funds-contributions/2"
  },
  {
    id: 3, word: "KIROHO", dir: "across", row: 3, col: 2, part: 1,
    template: "Nikisali tu na bila kuchangia, maendeleo gani yatakwamishwa? Maendeleo ya ___.",
    options: ["KIROHO", "KIFEDHA", "KIJAMII"],
    teachQuote: "Kila Mbahá'í, hata awe maskini kiasi gani, lazima atambue wajibu mzito anaopaswa kuubeba, na anapaswa kuwa na uhakika kwamba maendeleo yake ya kiroho yatategemea sana kiasi ambacho anathibitisha, kwa matendo, utayari wake wa kusaidia taasisi takatifu za Imani Yake.",
    teachSource: "Shoghi Effendi, barua ya 17 Julai 1937",
    teachLink: "https://bahai.org/library/authoritative-texts/compilations/bahai-funds-contributions/bahai-funds-contributions.xhtml"
  },
  {
    id: 4, word: "DHABIHU", dir: "across", row: 4, col: 0, part: 2,
    template: "Mpaka mtu awekapo mguu wake katika uwanja wa ___, ananyimwa kila fadhila na neema.",
    options: ["DHABIHU", "IBADA", "UPENDO"],
    teachQuote: "Mpaka mtu awekapo mguu wake katika uwanja wa dhabihu, ananyimwa kila fadhila na neema; na uwanja huu wa dhabihu ndio ulimwengu wa kufa kwa nafsi, ili mng'ao wa Mungu aliye hai uweze kung'aa.",
    teachSource: "'Abdu'l-Bahá",
    teachLink: "https://www.bahai-fund.com/science-of-generosity"
  },
  {
    id: 5, word: "UPENDO", dir: "across", row: 5, col: 3, part: 2,
    template: "Wajibu unasema: 'Lazima nitoe.' ___ unasema: 'Nataka kutoa.'",
    options: ["UPENDO", "WAJIBU", "HISIA"],
    teachQuote: "Lazima tuwe kama chemchemi ambayo inaendelea kujimwaga yote iliyo nayo na inaendelea kujazwa tena kutoka chanzo kisichoonekana.",
    teachSource: "Shoghi Effendi, Directives from the Guardian, uk. 87",
    teachLink: "https://reference.bahai.org/en/t/se/DG/dg-83.html"
  },
  {
    id: 6, word: "UMOJA", dir: "across", row: 2, col: 0, part: 2,
    template: "Nguvu ya kiroho hutoka kwenye ___, si kwenye mtu mmoja peke yake.",
    options: ["UMOJA", "PESA", "KIONGOZI"],
    teachQuote: "Kama kila muumini atatekeleza wajibu huu mtakatifu, tutashangazwa na ongezeko la nguvu litakalopatikana kwa mwili mzima.",
    teachSource: "Nyumba ya Haki ya Ulimwengu, Wellspring of Guidance",
    teachLink: "https://bahai-library.com/pdf/s/stewardship_development.pdf"
  }
];

const ROWS = 6;
const COLS = 9;

function getWordCells(w) {
  return w.word.split('').map((letter, i) => ({
    row: w.dir === 'across' ? w.row : w.row + i,
    col: w.dir === 'across' ? w.col + i : w.col,
    letter
  }));
}

function buildGridData() {
  const cells = {};
  WORDS.forEach(w => {
    getWordCells(w).forEach((c, i) => {
      const k = `${c.row},${c.col}`;
      if (!cells[k]) cells[k] = { letter: c.letter, wordIds: [], number: null };
      cells[k].wordIds.push(w.id);
      if (i === 0 && cells[k].number === null) cells[k].number = w.id;
    });
  });
  return cells;
}

const GRID_DATA = buildGridData();
let filled = {};
let solved = new Set();
let selectedId = null;
let flashState = {};
let optionsCache = {};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderStart() {
  document.getElementById('app').innerHTML = `
    <header>
      <h1>Fumbo la Mfuko</h1>
      <div class="subtitle">Maswali ya Warsha yetu ya Mfuko</div>
    </header>
    <div class="start-screen">
      <div class="start-icon">🧩</div>
      <div class="start-desc">
        Kabla ya warsha, jaribu maswali sita kutoka kwenye hotuba yetu ya leo.
        Kila swali lina majibu matatu -- moja tu ni sahihi. Bonyeza swali,
        kisha chagua jibu unalofikiri ni sahihi.
      </div>
      <button class="start-btn" onclick="startGame()">Anza</button>
    </div>
    <footer>Warsha ya Mfuko wa Bahá'í</footer>
  `;
}

function startGame() {
  filled = {};
  solved = new Set();
  selectedId = null;
  flashState = {};
  optionsCache = {};
  render();
}

function selectWord(id) {
  if (solved.has(id)) return;
  selectedId = id;
  if (!optionsCache[id]) {
    const w = WORDS.find(x => x.id === id);
    optionsCache[id] = shuffle(w.options);
  }
  flashState = {};
  render();
}

function tryWord(word) {
  if (!selectedId) return;
  const w = WORDS.find(x => x.id === selectedId);
  if (word === w.word) {
    flashState[word] = 'correct';
    render();
    setTimeout(() => {
      const cells = getWordCells(w);
      cells.forEach(c => { filled[`${c.row},${c.col}`] = c.letter; });
      solved.add(w.id);
      selectedId = null;
      flashState = {};
      render();
      showTeaching(w);
    }, 350);
  } else {
    flashState[word] = 'wrong';
    render();
    setTimeout(() => {
      flashState = {};
      render();
    }, 600);
  }
}

function showTeaching(w) {
  const modal = document.createElement('div');
  modal.className = 'teach-modal';
  modal.onclick = () => modal.remove();
  const allDone = solved.size === WORDS.length;
  modal.innerHTML = `
    <div class="teach-card" onclick="event.stopPropagation()">
      <div class="teach-word">${w.word}</div>
      <div class="teach-check">Sahihi! ✓ Swali la ${w.id}</div>
      <div class="teach-quote">"${w.teachQuote}"</div>
      <div class="teach-source">-- ${w.teachSource} &middot; <a href="${w.teachLink}" target="_blank" rel="noopener">chanzo</a></div>
      <button class="teach-btn" onclick="this.closest('.teach-modal').remove(); ${allDone ? 'showDone()' : ''}">${allDone ? 'Maliza' : 'Endelea'}</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function showDone() {
  render();
}

function renderGrid() {
  let html = `<div class="grid" style="grid-template-columns: repeat(${COLS}, 33px); grid-template-rows: repeat(${ROWS}, 33px);">`;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const k = `${r},${c}`;
      const cell = GRID_DATA[k];
      if (!cell) {
        html += `<div class="cell empty"></div>`;
        continue;
      }
      const isSelected = selectedId && getWordCells(WORDS.find(w => w.id === selectedId)).some(wc => wc.row === r && wc.col === c);
      const isDone = cell.wordIds.some(id => solved.has(id));
      const val = filled[k] || '';
      let cls = 'cell';
      if (isDone) cls += ' done';
      else if (isSelected) cls += ' selected';
      html += `<div class="${cls}">${cell.number ? `<span class="cell-num">${cell.number}</span>` : ''}${val}</div>`;
    }
  }
  html += `</div>`;
  return html;
}

function renderClueText(w) {
  if (w.template) {
    const parts = w.template.split('___');
    return `${parts[0]}<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>${parts[1]}`;
  }
  return w.clue;
}

function renderClueBar() {
  if (!selectedId) return '';
  const w = WORDS.find(x => x.id === selectedId);
  return `
    <div class="clue-bar">
      <div class="swali-tag">Swali la ${w.id}</div>
      <div class="clue-text">${renderClueText(w)}</div>
    </div>
  `;
}

function renderWordBank() {
  if (!selectedId) return '';
  const opts = optionsCache[selectedId] || [];
  let html = '<div class="word-bank">';
  opts.forEach(word => {
    let cls = 'word-btn';
    if (flashState[word] === 'correct') cls += ' correct-flash';
    if (flashState[word] === 'wrong') cls += ' wrong-flash';
    html += `<button class="${cls}" onclick="tryWord('${word}')">${word}</button>`;
  });
  html += '</div>';
  return html;
}

function renderCluesList() {
  const part1 = WORDS.filter(w => w.part === 1);
  const part2 = WORDS.filter(w => w.part === 2);

  function renderSection(title, words) {
    let html = `<div class="clue-section-title">${title}</div>`;
    words.forEach(w => {
      const isSolved = solved.has(w.id);
      const isActive = selectedId === w.id;
      let cls = 'clue-row';
      if (isSolved) cls += ' solved';
      else if (isActive) cls += ' active';
      const previewText = w.template ? w.template.replace('___', '_____') : w.clue;
      html += `
        <div class="${cls}" onclick="${isSolved ? '' : `selectWord(${w.id})`}">
          <span class="clue-row-num">${w.id}</span>
          <span class="clue-row-text">${previewText}</span>
        </div>
      `;
    });
    return html;
  }

  return `
    <div class="clues-list">
      ${renderSection('Sehemu ya 1: Nani na Kwa Nini', part1)}
      ${renderSection('Sehemu ya 2: Roho ya Kuchangia', part2)}
    </div>
  `;
}

function renderProgress() {
  let html = '';
  WORDS.forEach(w => {
    html += `<div class="pip ${solved.has(w.id) ? 'done' : ''}"></div>`;
  });
  return html;
}

function render() {
  const allDone = solved.size === WORDS.length;

  document.getElementById('app').innerHTML = `
    <header>
      <h1>Fumbo la Mfuko</h1>
      <div class="subtitle">Maswali ya Warsha yetu ya Mfuko</div>
      <div class="progress">${renderProgress()}</div>
    </header>
    <div class="grid-wrap">${renderGrid()}</div>
    ${!allDone ? renderClueBar() : ''}
    ${!allDone ? renderWordBank() : ''}
    ${!allDone && !selectedId ? '<div class="hint-row">↓ Bonyeza swali kuanza</div>' : ''}
    ${allDone ? renderDoneBanner() : ''}
    ${renderCluesList()}
    <footer>Warsha ya Mfuko wa Bahá'í</footer>
  `;
}

function renderDoneBanner() {
  return `
    <div class="done-card">
      <div class="done-title">Tayari kwa Warsha!</div>
      <div class="done-sub">Mmejibu maswali sita tutakayoyazungumzia leo.
      Wakati wa hotuba, nitawauliza: "Mnakumbuka swali la ngapi?"</div>
      <button class="start-btn" style="margin-top:20px" onclick="startGame()">Cheza Tena</button>
    </div>
  `;
}

renderStart();
</script>
</body>
</html>
